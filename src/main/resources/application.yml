spring.thymeleaf.cache: false
spring.thymeleaf.mode: HTML
spring.jackson.serialization.write_dates_as_timestamps: false

# Serve the static files under a name derived from their content, so a browser can never keep an
# index.js that no longer matches the template it came with: the url changes with the file.
spring.web.resources.chain.strategy.content.enabled: true
spring.web.resources.chain.strategy.content.paths: /**
spring.web.resources.cache.period: 365d

# The session only carries the flash messages shown after a redirect. Without this, Tomcat puts
# ;jsessionid= in the url of the redirect that opens it, which no controller matches: the page
# then came back as an error.
server.servlet.session.tracking-modes: cookie
